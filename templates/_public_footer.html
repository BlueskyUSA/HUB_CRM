<style>
.sf{background:#f5f9f9;border-top:1px solid #d8e9ea;text-align:center;padding:34px 14px 24px;font-family:Inter,Arial,sans-serif}
.sf-links{font-size:1.2rem;font-weight:600;line-height:2.2}
.sf-links a{margin:0 16px;color:#176878;white-space:nowrap;text-decoration:underline}
