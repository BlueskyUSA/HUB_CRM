{% extends "crm_base.html" %}
{% block title %}Change Password — {{ program_name }}{% endblock %}
{% block content %}
<h1>Change your password</h1>
{% if session.must_change %}<p class="muted" style="max-width:380px">You signed in with a temporary password. Enter it as the current password, then choose your own.</p>{% endif %}
<div class="card" style="max-width:380px">
  <form method="post">
    <div class="field"><label>Current password</label><input type="password" name="current_password" required></div>
    <div class="field"><label>New password (at least 8 characters; letters, numbers or both)</label><input type="password" name="new_password" required minlength="8"></div>
    <div class="field"><label>Type the new password again</label><input type="password" name="confirm_password" required minlength="8"></div>
    <button class="btn" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
