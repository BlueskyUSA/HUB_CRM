<form method="get" action="{{ url_for('.correspondence_search') }}" style="margin:12px 0; display:flex; gap:8px; max-width:560px; flex-wrap:wrap">
  <input type="search" name="q" value="{{ q or '' }}" placeholder="Search the wording of all letters (e.g. $ or 1,299)" style="flex:1; min-width:220px" aria-label="Search letters">
  <button class="btn" type="submit">Search letters</button>
</form>
